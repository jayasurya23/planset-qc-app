name: Deploy to Sandbox (staging)

# Mirrors deploy.yml but targets the SANDBOX Container App (castillo-qaqc-sandbox)
# from the `staging` branch — so experimental versions can be tried out without
# ever touching production. Auth is the same OIDC app (github-castillo-qaqc-deploy),
# which now trusts refs/heads/staging in addition to master.
#
# Staging images are tagged `staging-<sha>` so they never collide with prod's
# image tags. Reuses the same GitHub secrets as prod (RG + ACR + OIDC); the
# sandbox app name is not sensitive, so it's inlined.

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  id-token: write   # required for azure/login OIDC
  contents: read

env:
  IMAGE: planset-qc
  SANDBOX_APP: castillo-qaqc-sandbox
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "${{ secrets.ACR_NAME }}" \
            --image "${IMAGE}:staging-${{ github.sha }}" \
            .

      - name: Roll the Sandbox app to the new image
        run: |
          az containerapp update \
            --name "${SANDBOX_APP}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ secrets.ACR_NAME }}.azurecr.io/${IMAGE}:staging-${{ github.sha }}"
