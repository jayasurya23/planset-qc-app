name: Deploy to Azure

# Builds the container in ACR and rolls the Container App to the new image.
# Auth is OIDC (federated credentials) — no stored publish profile or password.
# Required GitHub secrets (see DEPLOYMENT.md):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   AZURE_RESOURCE_GROUP, AZURE_CONTAINERAPP_NAME, ACR_NAME

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write   # required for azure/login OIDC
  contents: read

env:
  IMAGE: planset-qc
  # Run the JS actions (checkout, azure/login) on Node 24 instead of the
  # deprecated Node 20 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "${{ secrets.ACR_NAME }}" \
            --image "${IMAGE}:${{ github.sha }}" \
            --image "${IMAGE}:latest" \
            .

      - name: Roll Container App to the new image
        run: |
          az containerapp update \
            --name "${{ secrets.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ secrets.ACR_NAME }}.azurecr.io/${IMAGE}:${{ github.sha }}"
