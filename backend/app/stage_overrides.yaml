# Stage-gating overlay for QC rules.
#
# Every rule has a "min_stage" — the earliest design stage at which it should
# fire. Stages are ordered: 30 < 60 < 90 < IFC < AsBuilt. When a user selects
# stage X, any rule with min_stage <= X fires normally; rules with a higher
# min_stage are either DEFERRED (emitted as status "Deferred" with a "N/A at
# this stage" note) OR evaluated anyway if the corresponding sheet is actually
# present in the PDF (lenient bypass).
#
# Values below are derived empirically from Castillo sample plansets at each
# stage. See backend/scripts/extract_stage_sheets.py.
#
# Edit this file — not rule_registry.py — to adjust stage requirements.
# Re-ingesting V4 rules from Excel will NOT overwrite these.

# Category → minimum stage.
#
# The category's min_stage is the default for every rule in that category.
# Individual rules can override via the `rule_overrides` section below.
category_min_stage:
  # ── Always required (30% and beyond) ──
  "AI Input Gate":     "30"
  "BOD / Due Diligence": "30"
  "Title Block":       "30"
  "E-001":             "30"
  "E-002":             "30"
  "E-010":             "30"
  "E-050":             "30"
  "E-100":             "30"
  "E-101/E-102":       "30"
  "E-900":             "30"

  # ── 60% (IFP / permit set) ──
  "E-120":             "60"   # grounding plan
  "E-130":             "60"   # lightning protection
  "E-140":             "60"   # trenching details
  "E-200":             "60"   # electrical detail
  "E-300":             "60"   # AC single-line
  "E-450":             "60"   # PV harness layout
  "E-500-E-504":       "60"   # schedules / feeder
  # (Specs sheet E-800 isn't in the V4 category list — no entry needed)

  # ── 90% ──
  "E-011":             "90"   # reference / BOD sheet
  "E-103/E-104":       "90"   # AC details
  "E-110":             "90"   # stringing plan
  "E-210":             "90"   # electrical detail (sub-family)
  "E-400":             "90"   # AC one-line
  # (BOM sheet E-901 not in V4 categories — no entry needed)

  # ── IFC only ──
  "E-106":             "IFC"
  "E-107":             "IFC"
  "E-214-E-217":       "IFC"  # structural/mechanical interface details
  "E-420-E-422":       "IFC"  # arc flash + protection coordination
  "E-601":             "IFC"  # transmittal / cover summary
  "Cross-Sheet":       "IFC"  # needs full set to cross-reference

# Rule-level overrides. Keyed by rule.key. Wins over category_min_stage.
#
# Use for outliers inside an otherwise-common category:
#   e.g. Title Block is "30" overall, but "PE wet stamp" is IFC-only.
#
# Explicit overrides are AUTHORITATIVE — the V4 engine's lenient
# "fire anyway when the sheet is in the PDF" bypass is disabled for
# rules listed here. That bypass is meant for category defaults, not
# for rules that were intentionally gated to a later stage.
#
# Add entries as incorrect gating surfaces in review.
rule_overrides:
  # E-050 equipment list rule whose intent is IFC-only. At 30/60/90 the
  # equipment list sheet is always drawn, but TBD entries are still
  # acceptable — submittals get firmed up by the IFC submission. Without
  # an explicit override, the rule fires from 30% onward (E-050 default).
  v4_e_050_no_tbd_at_ifc: IFC


# Rules that should be suppressed entirely — not emitted as Pass/Fail/NR/Deferred,
# not dispatched to the vision model. Use for confirmed duplicates where the same
# check exists in a more appropriate category (e.g. a Cross-Sheet version beats a
# sheet-specific one). Survives re-ingest from Excel.
#
# Each entry is the rule.key + an inline comment explaining the dupe resolution.
disabled_rules:
  # "FLA: character-identical E-100 = E-101 = E-103" — Cross-Sheet version kept
  - v4_e_100_fla_character_identical_e_100_e_101_e_103
  # "XFMR primary V: six-document match" — Cross-Sheet version kept
  - v4_e_100_xfmr_primary_v_six_document_match
  # "Scale annotation = scale bar" — Title Block version kept
  - v4_e_010_scale_annotation_scale_bar
  # "Conduit sizes = E-210 routing" — Cross-Sheet version kept
  - v4_e_300_conduit_sizes_e_210_routing
  # "Conduit sizes = E-210 routing annotations" — same check, Cross-Sheet version kept
  - v4_e_300_conduit_sizes_e_210_routing_annotations
  # "Conduit fill <= 40%" — NEC-cited variant kept for traceability
  - v4_e_300_conduit_fill_40
  # "Feeder breaker >= 1.25× FLA" — longer variant with "(or 100% if documented)" kept
  - v4_e_101_e_102_feeder_breaker_1_25_fla
  # "Utility 24/7 access note" — the "...present" variant in E-010 kept
  - v4_e_010_utility_24_7_access_note
  - v4_e_011_utility_24_7_access_note
  # NEC code year duplicates — v4_e_001_nec_year_jurisdiction_qualifier_format
  # (the new rule from training-doc synthesis) is the comprehensive cover-sheet
  # vision check; the three below are legacy keyword/cross-ref variants that
  # repeated the same finding on multiple categories.
  # User annotation on the E-002 note rule: "We don't need to do a detailed
  # checking of notes. As long as this is latest version we should be fine."
  - v4_title_block_nec_code_year_with_documented_basis  # duplicate of v4_e_001_nec_year_jurisdiction_qualifier_format
  - v4_e_002_nec_code_year_note_e_001  # cross-ref subsumed by cover-sheet vision check
  - v4_e_002_nec_code_year_note  # detail-of-notes check (user said not needed)
  - v4_bod_due_diligence_nec_edition_with_documented_basis  # word-for-word duplicate of v4_e_001_nec_year_jurisdiction_qualifier_format
  # v4_e_001_nec_and_ibc_editions_ahj is KEPT — it adds the IBC building-code
  # check which the new jurisdiction-qualifier rule does not cover.
  # XFMR %Z and X/R — V4-ENH variant (xfmr_z_and_x_r_shown_even_at_30) is kept;
  # it adds the early-stage requirement and Joe-training reasoning. The plain
  # V3 variant below is the same check without the extra context.
  - v4_e_100_xfmr_z_and_x_r_shown
  # CT ratio / accuracy / burden — V4-ENH variant (ct_ratio_accuracy_burden)
  # is kept; it explicitly mentions DAS meter compatibility. The V3 variant
  # is the same check without the DAS context.
  - v4_e_100_ct_ratio_accuracy_class_burden

  # ── Bulk V3-vs-V4-ENH duplicate sweep ──────────────────────────────────
  # The V4 ingest re-imported many V3 rules with slightly more descriptive
  # titles / sources (V4-ENH variants) but did not disable the originals.
  # The V4-ENH variant is kept in each case; the V3 duplicate below is
  # disabled. Identified by the registry-similarity sweep (Jaccard ≥ 0.6
  # on normalized titles within the same category, opposite v4_status).

  # Inverter submittal — V4-ENH "Inverter submittal + installation manual" kept
  - v4_ai_input_gate_approved_inverter_submittal_installation_manu
  # Switchgear / AC combiner — V4-ENH "Approved switchgear / AC combiner" kept
  - v4_ai_input_gate_approved_switchgear_ac_combiner_submittal
  # XFMR datasheet — V4-ENH "XFMR datasheet + shop drawing" kept
  - v4_e_900_xfmr_datasheet_and_shop_drawing
  # Surge arrester MCOV — V4-ENH "MCOV from IEEE C62.22 + feeder grounding" kept
  - v4_e_100_surge_arrester_mcov_from_ieee_c62_22
  # Module submittal — V4-ENH "Approved module submittal" kept
  - v4_ai_input_gate_approved_module_submittal_available
  # Transformer submittal — V4-ENH "Approved transformer submittal" kept
  - v4_ai_input_gate_approved_transformer_submittal_available
  # Voltage drop workbook — V4-ENH "Voltage drop workbook" kept
  - v4_ai_input_gate_voltage_drop_calculation_workbook
  # Thermal ampacity study — V4-ENH "Thermal ampacity study" kept
  - v4_ai_input_gate_thermal_ampacity_study_available
  # Project name match — V4-ENH "Project name exact match (cross-propagation)" kept
  - v4_title_block_project_name_exact_match
  # Access road widths — V4-ENH "Access road widths = project criteria" kept
  - v4_e_010_access_road_widths_meet_criteria
  # MV cable description — V4-ENH "MV cable four-element description" kept
  - v4_e_300_mv_cable_description_four_elements
  # XFMR change propagation — V4-ENH "(6 sheets)" variant kept
  - v4_cross_sheet_xfmr_change_propagation
