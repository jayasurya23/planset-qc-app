# ============================================================================
# Castillo Engineering – Planset QC Rule Registry
# ============================================================================
# Each rule has:
#   key          – unique identifier (matches issue item_key)
#   category     – display grouping
#   title        – short human-readable name
#   description  – longer explanation
#   severity     – default severity: low | medium | high
#   check_type   – how the rule is evaluated:
#                    sheet_existence | keyword | regex | drawing_index |
#                    title_block | gemini_vision | electrical_calc | manual
#   nec_ref      – NEC article references (if applicable)
#   handbook_ref – Checker's Handbook section reference
#   confidence   – default confidence (0.0–1.0)
#
# For keyword checks:
#   keywords       – list of keywords to search for
#   min_matches    – minimum keyword matches for Pass
#   search_scope   – where to search: cover | page_title | sld | dc | tld |
#                     relay | electrical | grounding | site_plan | pole_lineup
#
# For sheet_existence checks:
#   title_keywords – title patterns to match against sheet titles
#
# For electrical_calc checks:
#   calc_function  – name of the function in electrical_calcs.py
#   inputs         – list of required project_details fields
# ============================================================================

category_order:
  - Drawing Index
  - Title Block
  - Cover Sheet
  - System Information Table
  - General Notes
  - Site Plan
  - Pole Line Up
  - Engineered Equipment List
  - AC Single Line Diagram
  - DC Line Diagram
  - Three Line Diagram
  - Relay and Inverter Settings
  - AUX SLD
  - Communication Diagram
  - Feeder Plan
  - Communication Feeder Plan
  - Equipment Area Feeder Plan
  - Electrical Sheet
  - Inverter Zone Map
  - Elevation Details
  - Trenching Details
  - Overall Site Grounding Plan
  - Grounding Diagram
  - CAB or Cable Hanger Details
  - PAD / Slab Details
  - Pole Details
  - Labels
  - PVSyst Analysis Summary
  - Cross-Sheet Consistency

rules:

  # ═══════════════════════════════════════════════════════════════════════════
  # Drawing Index
  # ═══════════════════════════════════════════════════════════════════════════
  - key: drawing_index_page_exists
    category: Drawing Index
    title: Drawing index exists
    description: Cover sheet should include a drawing index.
    severity: high
    check_type: drawing_index
    confidence: 0.98

  - key: drawing_index_sheet_match
    category: Drawing Index
    title: All indexed sheets are present
    description: Every sheet listed in the drawing index should be present in the PDF.
    severity: high
    check_type: drawing_index
    confidence: 0.97

  - key: drawing_index_no_extras
    category: Drawing Index
    title: No extra sheets outside the drawing index
    description: PDF should not include extra sheets that are not listed in the drawing index.
    severity: medium
    check_type: drawing_index
    confidence: 0.90

  - key: drawing_index_order
    category: Drawing Index
    title: Sheet order matches drawing index
    description: Actual sheet order should follow the drawing index order.
    severity: medium
    check_type: drawing_index
    confidence: 0.93

  - key: drawing_index_spelling
    category: Drawing Index
    title: Sheet names spelled correctly
    description: Check each page for plotting issues and misspelled page names/numbers.
    severity: low
    check_type: gemini_vision
    confidence: 0.75

  # ═══════════════════════════════════════════════════════════════════════════
  # Title Block
  # ═══════════════════════════════════════════════════════════════════════════
  - key: title_block_sheet_number
    category: Title Block
    title: Each page has a sheet number
    description: Every sheet should show a valid sheet number in the title block.
    severity: medium
    check_type: title_block
    confidence: 0.96

  - key: title_block_sheet_name
    category: Title Block
    title: Each page has a sheet title
    description: Every sheet should show a readable sheet title in the title block.
    severity: medium
    check_type: title_block
    confidence: 0.89

  # SOV rule disabled — not all plansets use this field
  # - key: title_block_sov_date_designer
  #   category: Title Block
  #   title: SOV, Date, Designer, Engineer, Revision
  #   description: Title block should show SOV, Date, Designer, Engineer, and Revision Number.
  #   severity: medium
  #   check_type: gemini_vision
  #   confidence: 0.85

  - key: title_block_logos
    category: Title Block
    title: EPC Logo and Owner Logo present
    description: Title block should display EPC and Owner logos.
    severity: medium
    check_type: gemini_vision
    confidence: 0.80

  - key: title_block_project_id
    category: Title Block
    title: Castillo Project ID shown
    description: Title block should include the Castillo Project ID.
    severity: medium
    check_type: gemini_vision
    confidence: 0.80

  - key: title_block_eor_seal
    category: Title Block
    title: Correct EOR Seal
    description: Title block should have the correct Engineer of Record seal.
    severity: medium
    check_type: gemini_vision
    confidence: 0.80

  - key: title_block_project_name
    category: Title Block
    title: Project Name shown
    description: Project name should appear in the title block.
    severity: medium
    check_type: gemini_vision
    confidence: 0.85

  - key: title_block_project_address
    category: Title Block
    title: Project Address shown
    description: Project address should appear in the title block.
    severity: medium
    check_type: gemini_vision
    confidence: 0.85

  - key: title_block_coordinates
    category: Title Block
    title: Site Coordinates shown
    description: Site coordinates (lat/long) should appear in the title block.
    severity: low
    check_type: gemini_vision
    confidence: 0.80

  - key: title_block_der_number
    category: Title Block
    title: DER Number (if Ameren)
    description: DER number should appear in the title block if the utility is Ameren.
    severity: low
    check_type: gemini_vision
    confidence: 0.70

  # ═══════════════════════════════════════════════════════════════════════════
  # Cover Sheet
  # ═══════════════════════════════════════════════════════════════════════════
  - key: cover_sheet_project_info
    category: Cover Sheet
    title: Project Name, Address, Coordinates
    description: Cover sheet should show project name, address, and site coordinates.
    severity: high
    check_type: keyword
    search_scope: cover
    keywords:
      - ["PROJECT NAME", "PROJECT TITLE", "PROJECT:"]
      - ["SITE LOCATION", "SITE ADDRESS", "ADDRESS", "LOCATION"]
    min_matches: 2
    confidence: 0.95

  - key: cover_sheet_building_codes
    category: Cover Sheet
    title: Building Codes referenced
    description: "Building codes should be listed: State/County/City adopted, or Castillo preference noted."
    severity: medium
    check_type: gemini_vision
    confidence: 0.80

  - key: cover_sheet_owner_info
    category: Cover Sheet
    title: Owner Name, Address, Telephone
    description: Owner information including name, address, and telephone number.
    severity: medium
    check_type: keyword
    search_scope: cover
    keywords: ["OWNER", "PROPERTY OWNER", "CLIENT"]
    min_matches: 1
    confidence: 0.85

  - key: cover_sheet_epc_info
    category: Cover Sheet
    title: EPC Name, Address, Telephone
    description: EPC contractor information including name, address, and telephone number.
    severity: medium
    check_type: keyword
    search_scope: cover
    keywords: ["ENGINEERING", "EPC", "CONTRACTOR", "CASTILLO"]
    min_matches: 1
    confidence: 0.85

  - key: cover_sheet_castillo_info
    category: Cover Sheet
    title: EOR Name, License, Checker, Designer
    description: Castillo EOR name, license number, state, and checker/designer names.
    severity: medium
    check_type: gemini_vision
    confidence: 0.80

  - key: cover_sheet_county_map
    category: Cover Sheet
    title: County/State Map present
    description: "County map with state map shown; county name not blocked by arrow."
    severity: medium
    check_type: gemini_vision
    confidence: 0.80

  - key: cover_sheet_array_view
    category: Cover Sheet
    title: Array View with North Arrow
    description: Array view image showing modules, fence, road, with north arrow.
    severity: medium
    check_type: gemini_vision
    confidence: 0.80

  - key: cover_sheet_vicinity_map
    category: Cover Sheet
    title: Vicinity Map present
    description: Vicinity map showing nearest city and roads to site.
    severity: medium
    check_type: gemini_vision
    confidence: 0.80

  - key: cover_sheet_drawing_index
    category: Cover Sheet
    title: Drawing Index consistency
    description: Drawing index on cover sheet is consistent with actual sheets in the planset.
    severity: high
    check_type: drawing_index
    confidence: 0.90

  - key: cover_sheet_system_info
    category: Cover Sheet
    title: System information table populated
    description: Cover sheet should contain core module, inverter, DC size, AC size, and racking info.
    severity: high
    check_type: keyword
    search_scope: cover
    keywords: ["MODULE", "INVERTER", "TOTAL AC SIZE", "TOTAL DC SIZE", "RACKING", "DC/AC RATIO"]
    min_matches: 3
    confidence: 0.94

  # ═══════════════════════════════════════════════════════════════════════════
  # System Information Table
  # ═══════════════════════════════════════════════════════════════════════════
  - key: sysinfo_module_specs
    category: System Information Table
    title: PV Module Make, Model, STC Rating
    description: Module make, model, and STC wattage rating should be shown.
    severity: high
    check_type: gemini_vision
    confidence: 0.85

  - key: sysinfo_string_config
    category: System Information Table
    title: String Size and Quantity
    description: String size (modules per string) and total string quantity.
    severity: high
    check_type: gemini_vision
    confidence: 0.85

  - key: sysinfo_dc_size
    category: System Information Table
    title: Total DC Size
    description: Total DC system size in kWp or MWp.
    severity: high
    check_type: gemini_vision
    confidence: 0.85

  - key: sysinfo_inverter_specs
    category: System Information Table
    title: Inverter Make, Model, kVA/kW, Quantity
    description: "Inverter make, model, kVA rating, kW rating, derated rating (if applicable), and quantity."
    severity: high
    check_type: gemini_vision
    confidence: 0.85

  - key: sysinfo_ac_size
    category: System Information Table
    title: Total AC Size
    description: Total AC system size in kVA or MVA.
    severity: high
    check_type: gemini_vision
    confidence: 0.85

  - key: sysinfo_racking
    category: System Information Table
    title: Racking Make, Model, Size
    description: Racking system make, model, and size.
    severity: medium
    check_type: gemini_vision
    confidence: 0.80

  - key: sysinfo_ratios_spacing
    category: System Information Table
    title: DC/AC Ratio, Pitch, Interrow, GCR, Tilt, Azimuth
    description: "DC/AC ratio, pitch, interrow spacing, GCR, tilt/tracker angle, and azimuth."
    severity: medium
    check_type: gemini_vision
    confidence: 0.80

  # ═══════════════════════════════════════════════════════════════════════════
  # General Notes
  # ═══════════════════════════════════════════════════════════════════════════
  - key: general_notes_page_exists
    category: General Notes
    title: General notes sheet exists
    description: A general notes sheet should be present.
    severity: medium
    check_type: sheet_existence
    title_keywords: ["GENERAL NOTE", "GENERAL ELECTRICAL NOTE"]

  - key: general_notes_latest_version
    category: General Notes
    title: Latest version of general notes
    description: General notes should be the latest version. Check for most recent NEC year and code references.
    severity: medium
    check_type: gemini_vision
    confidence: 0.75

  # ═══════════════════════════════════════════════════════════════════════════
  # Site Plan
  # ═══════════════════════════════════════════════════════════════════════════
  - key: site_plan_split_pages
    category: Site Plan
    title: Split pages per discretion
    description: Large sites should have the site plan split across multiple pages for readability.
    severity: low
    check_type: gemini_vision
    confidence: 0.70

  - key: site_plan_north_arrow_scale
    category: Site Plan
    title: North Arrow and Scale
    description: Site plan should have a north arrow and scale bar/notation.
    severity: high
    check_type: gemini_vision
    confidence: 0.85

  - key: site_plan_core_items
    category: Site Plan
    title: Site plan contains key callouts
    description: Check for scale, property line, fence, access, weather station.
    severity: medium
    check_type: keyword
    search_scope: site_plan
    title_match: ["SITE PLAN", "OVERALL SITE", "SITE LAYOUT"]
    keywords: ["SCALE:", "PROPERTY LINE", "FENCE", "ACCESS", "WEATHER STATION"]
    min_matches: 2
    confidence: 0.84

  - key: site_plan_mv_cab_lines
    category: Site Plan
    title: MV Run and CAB Lines shown
    description: MV cable run and CAB lines should be visible on the site plan.
    severity: medium
    check_type: gemini_vision
    confidence: 0.80

  - key: site_plan_background_faded
    category: Site Plan
    title: Background image properly faded
    description: Background aerial image should be properly faded for visibility.
    severity: low
    check_type: gemini_vision
    confidence: 0.75

  - key: site_plan_notes
    category: Site Plan
    title: Site Plan Notes (DCB topology, weather sensor, fence grounding)
    description: "Notes for DCB/inverter topology, weather sensor references, sheet references, and fence grounding."
    severity: medium
    check_type: gemini_vision
    confidence: 0.75

  - key: site_plan_section_view
    category: Site Plan
    title: Racking Section View (pitch, spacing, height)
    description: "Section view showing fixed vs tracker, pitch, interrow spacing, and racking height."
    severity: medium
    check_type: gemini_vision
    confidence: 0.80

  - key: site_plan_dimensions
    category: Site Plan
    title: Dimensions (property line, setbacks, road, fence)
    description: "Dimensions from property line, all four corners, setbacks, road width/turnaround, fence setback."
    severity: high
    check_type: gemini_vision
    confidence: 0.80

  - key: site_plan_topo_lines
    category: Site Plan
    title: Topographic lines with elevation
    description: Topo lines with elevation data should be shown.
    severity: low
    check_type: gemini_vision
    confidence: 0.70

  - key: site_plan_callouts
    category: Site Plan
    title: Callouts (access, fence, pad, gate, racking, parcel, setbacks)
    description: "Callouts for site access, fence, pad location, gate size, road, racking size/qty, property/lease line, parcel ID, setbacks, civil elements."
    severity: medium
    check_type: gemini_vision
    confidence: 0.80

  - key: site_plan_text_consistent
    category: Site Plan
    title: Text size is consistent
    description: All text on the site plan should be a consistent readable size.
    severity: low
    check_type: gemini_vision
    confidence: 0.70

  - key: site_plan_greying
    category: Site Plan
    title: Proper greying for visibility
    description: Background features should be properly greyed out for visibility of active plan elements.
    severity: low
    check_type: gemini_vision
    confidence: 0.70

  - key: site_plan_inverter_dcb_note
    category: Site Plan
    title: Inverter or DCB typical note shown
    description: An inverter or DCB typical note should be visible on the site plan.
    severity: medium
    check_type: gemini_vision
    confidence: 0.75

  - key: site_plan_civil_elements
    category: Site Plan
    title: Civil elements (vegetative buffer, landscape, concrete washout)
    description: "Civil elements like vegetative buffer, landscape buffer, and concrete washout should be called out."
    severity: low
    check_type: gemini_vision
    confidence: 0.70

  # ═══════════════════════════════════════════════════════════════════════════
  # Pole Line Up
  # ═══════════════════════════════════════════════════════════════════════════
  - key: pole_lineup_north_arrow_scale
    category: Pole Line Up
    title: North Arrow and Scale
    description: Pole line up should have north arrow and scale.
    severity: high
    check_type: gemini_vision
    confidence: 0.85

  - key: pole_lineup_core_items
    category: Pole Line Up
    title: Pole line up contains key items
    description: "Check for scale, POI references, and MV callouts."
    severity: medium
    check_type: keyword
    search_scope: pole_lineup
    title_match: ["POLE LINE", "POLE LINEUP", "INTERCONNECTION"]
    keywords: ["SCALE:", "POI", "UNDERGROUND", "LEGEND", "MV"]
    min_matches: 2
    confidence: 0.83

  - key: pole_lineup_assumed_note
    category: Pole Line Up
    title: Assumed pole lineup noted
    description: "If the pole lineup is assumed, a note should state that."
    severity: low
    check_type: gemini_vision
    confidence: 0.70

  - key: pole_lineup_consistency
    category: Pole Line Up
    title: Pole names/numbers consistent with SLD, 3LD, Pole Elevation
    description: "Pole name and number should be consistent across SLD, 3LD, and Pole Elevation sheets."
    severity: high
    check_type: gemini_vision
    confidence: 0.80

  - key: pole_lineup_poi_details
    category: Pole Line Up
    title: POI Details (utility, voltage, feeder, fault current)
    description: "POI should show utility name, voltage, feeder grounding, pole/feeder number, fault current, and be labeled as Point of Interconnection."
    severity: high
    check_type: gemini_vision
    confidence: 0.85

  - key: pole_lineup_dimensions
    category: Pole Line Up
    title: Dimensions between poles and from road/fence
    description: "Distances between poles and from access road, fence, gate should be shown."
    severity: medium
    check_type: gemini_vision
    confidence: 0.80

  - key: pole_lineup_mv_overhead
    category: Pole Line Up
    title: Underground MV run and overhead line distinction
    description: "Underground MV run from equipment area shown; new vs existing overhead lines distinguished."
    severity: medium
    check_type: gemini_vision
    confidence: 0.80

  - key: pole_lineup_delineation
    category: Pole Line Up
    title: Delineation line (client vs utility scope)
    description: Delineation line for client vs utility scope should be shown.
    severity: medium
    check_type: gemini_vision
    confidence: 0.80

  - key: pole_lineup_legend_table
    category: Pole Line Up
    title: Correct legend table
    description: Pole line up should have the correct legend table showing pole types and symbols.
    severity: medium
    check_type: gemini_vision
    confidence: 0.75

  - key: pole_lineup_compare_impact_study
    category: Pole Line Up
    title: Compare poles with impact study or client CAD
    description: Pole locations should be compared with the impact study or client-provided CAD drawings.
    severity: medium
    check_type: manual
    confidence: 0.50

  - key: pole_lineup_grey_adjacent
    category: Pole Line Up
    title: Grey out adjacent interconnection
    description: Adjacent interconnection equipment should be greyed out for clarity.
    severity: low
    check_type: gemini_vision
    confidence: 0.70

  # ═══════════════════════════════════════════════════════════════════════════
  # Engineered Equipment List
  # ═══════════════════════════════════════════════════════════════════════════
  - key: equipment_list_exists
    category: Engineered Equipment List
    title: Equipment list sheet exists
    description: Engineered equipment list should be included.
    severity: medium
    check_type: sheet_existence
    title_keywords: ["EQUIPMENT LIST", "EQUIPMENT SCHEDULE", "BOM", "BILL OF MATERIAL"]

  - key: equipment_list_completeness
    category: Engineered Equipment List
    title: "All equipment: name, qty, manufacturer, model, rating"
    description: "Each equipment item should have name, quantity, manufacturer, model, and rating."
    severity: high
    check_type: gemini_vision
    confidence: 0.80

  - key: equipment_list_consistency
    category: Engineered Equipment List
    title: "Consistent with SLD, 3LD, and overall design"
    description: "Equipment list should be consistent with SLD, 3LD, and overall design."
    severity: high
    check_type: gemini_vision
    confidence: 0.80

  - key: equipment_list_submittal_status
    category: Engineered Equipment List
    title: Review submittal status
    description: Equipment submittal status should be reviewed and noted.
    severity: medium
    check_type: manual
    confidence: 0.50

  - key: equipment_list_naming_format
    category: Engineered Equipment List
    title: Equipment naming format per Joe's table
    description: Equipment naming should follow the standard naming format from Joe's table.
    severity: medium
    check_type: gemini_vision
    handbook_ref: "Part 1 – Equipment Naming Table"
    confidence: 0.75

  # ═══════════════════════════════════════════════════════════════════════════
  # AC Single Line Diagram
  # ═══════════════════════════════════════════════════════════════════════════
  - key: sld_pages_exist
    category: AC Single Line Diagram
    title: Single line diagram sheets exist
    description: Single line diagram sheets should be included in the set.
    severity: medium
    check_type: sheet_existence
    title_keywords: ["SINGLE LINE", "SINGLE-LINE", "SLD", "AC ONE LINE", "ONE-LINE"]

  - key: sld_stringing
    category: AC Single Line Diagram
    title: "Stringing validation (V, I, P, MPPT, inputs, temperature)"
    description: "Verify stringing: voltage, current, power, MPPT range, number of inputs, and temperature limits."
    severity: high
    check_type: electrical_calc
    calc_function: validate_stringing
    nec_ref: "NEC 690.7"
    confidence: 0.90

  - key: sld_transformer_content
    category: AC Single Line Diagram
    title: Transformer details shown (kVA, windings, BIL)
    description: "SLD should show transformer kVA, winding config (Delta/Wye), voltage, BIL, impedance Z%."
    severity: high
    check_type: keyword
    search_scope: sld
    title_match: ["SINGLE LINE", "SINGLE-LINE", "SLD", "AC ONE LINE", "ONE-LINE"]
    exclude_title: ["DC", "AUX"]
    keywords: ["TRANSFORMER", "XFMR", "KVA", "WINDING", "DELTA", "WYE"]
    min_matches: 2
    confidence: 0.80

  - key: sld_equipment_ratings
    category: AC Single Line Diagram
    title: Equipment ratings and quantities
    description: "All equipment should show name, make/model, current, voltage notation, phase, SCCR, NEMA, I/O cables, OCPD, disconnects."
    severity: high
    check_type: gemini_vision
    confidence: 0.80

  - key: sld_breakers
    category: AC Single Line Diagram
    title: "Breakers (phase, count, dial settings, cable limits)"
    description: "Breakers should show phase, count, dial settings, and cable limits (size, sets, material)."
    severity: high
    check_type: gemini_vision
    confidence: 0.80

  - key: sld_six_disconnect_rule
    category: AC Single Line Diagram
    title: Six disconnect rule for switchboard
    description: Verify compliance with the six disconnect rule for switchboard.
    severity: high
    check_type: gemini_vision
    nec_ref: "NEC 408.36"
    confidence: 0.80

  - key: sld_transformer
    category: AC Single Line Diagram
    title: "Transformer (kVA, windings, BIL, cooling, Z%, X/R)"
    description: "Transformer: kVA >= total inverter kVA, primary/secondary winding config, voltage, BIL, cooling type, Z%, X/R, internal fuse/switch."
    severity: high
    check_type: electrical_calc
    calc_function: validate_transformer
    confidence: 0.85

  - key: sld_mv_equipment
    category: AC Single Line Diagram
    title: "MV Equipment (arrestor, meter CT/VT, recloser, GOAB)"
    description: "MV equipment: surge arrestor MCOV, meter CT/VT ratio and accuracy, recloser power/comms, aux transformer, GOAB as main disconnect."
    severity: high
    check_type: gemini_vision
    confidence: 0.80

  - key: sld_cable_sizing_content
    category: AC Single Line Diagram
    title: Cable and conduit sizing (DC, LV, MV)
    description: "Cable sizing: MV direct buried check, insulation, below vs above 800A, terminal rating, cable sets < 10."
    severity: medium
    check_type: keyword
    search_scope: sld
    title_match: ["SINGLE LINE", "SINGLE-LINE", "SLD", "AC ONE LINE", "ONE-LINE"]
    exclude_title: ["DC", "AUX"]
    keywords: ["AWG", "KCMIL", "XHHW", "THWN", "PV WIRE", "CONDUIT", "90°C", "75°C"]
    min_matches: 2
    confidence: 0.82

  - key: sld_mv_equipment_content
    category: AC Single Line Diagram
    title: MV equipment shown (recloser, GOAB, arrestor, meter CT/VT)
    description: "SLD should show recloser, GOAB disconnect, surge arrestor MCOV, meter CT/VT ratios."
    severity: medium
    check_type: keyword
    search_scope: sld
    title_match: ["SINGLE LINE", "SINGLE-LINE", "SLD", "AC ONE LINE", "ONE-LINE"]
    exclude_title: ["DC", "AUX"]
    keywords: ["RECLOSER", "GOAB", "SURGE ARRESTOR", "MCOV", "METER", "CT RATIO", "VT RATIO", "DISCONNECT"]
    min_matches: 2
    confidence: 0.80

  - key: sld_inverter_content
    category: AC Single Line Diagram
    title: Inverter details shown (make, kVA/kW, FLA, OCPD)
    description: "SLD should show inverter make/model, kVA/kW rating, FLA, and OCPD sizing."
    severity: medium
    check_type: keyword
    search_scope: sld
    title_match: ["SINGLE LINE", "SINGLE-LINE", "SLD", "AC ONE LINE", "ONE-LINE"]
    exclude_title: ["DC", "AUX"]
    keywords: ["INVERTER", "KW", "KVA", "MPPT", "FLA", "OCPD"]
    min_matches: 2
    confidence: 0.78

  - key: sld_notes_content
    category: AC Single Line Diagram
