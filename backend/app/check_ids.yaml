  - id: transformer_primary_grounding
    title: Transformer primary-side winding configuration and grounding treatment
    instruction: 'TANK / ENCLOSURE BOND FIRST, AND UNCONDITIONALLY: the transformer TANK, frame and pad-mounted
      enclosure must be bonded to the grounding electrode system regardless of winding configuration (NEC
      250.4(A)(2) and, over 1000 V, 250.190). A transformer depicted on these sheets with NO tank or enclosure
      ground shown is a FAIL. This Fail is unconditional and overrides any general absence rule appended
      below this instruction; it is not downgraded to Needs Review.

      Then read the primary winding configuration (delta or wye) and how the primary side is grounded:
      the tank / enclosure bonding above, and, for a wye primary, whether the primary neutral is brought
      out and grounded.

      WHAT ACTUALLY GOVERNS THE NEUTRAL. Whether the medium-voltage PRIMARY NEUTRAL is grounded is set
      by the UTILITY INTERCONNECTION REQUIREMENT and the utility''s own grounding standard, not by the
      NEC: a four-wire multi-grounded wye distribution source normally requires the primary neutral to
      be grounded and bonded to the tank, while a three-wire delta or ungrounded-wye source requires that
      it not be. NEC 250.30 governs the DERIVED (secondary) side and NEC 450.5 governs grounding autotransformers,
      so do NOT cite either as if it decided the primary; state that the basis is the interconnection
      requirement and name the source configuration you read on these sheets. (A zig-zag or wye-delta
      grounding autotransformer, where one is shown, is graded under check transformer_secondary_grounding,
      which owns NEC 450.5.)

      FAIL = no tank / enclosure ground shown at all, a delta primary drawn with a neutral-to-ground connection,
      or a wye primary neutral drawn floating where these sheets or their notes state a multi-grounded-wye
      utility source. PASS = the winding configuration is labeled, the tank is bonded, and the primary
      neutral treatment matches the utility source stated on these sheets. NEEDS REVIEW = the tank bond
      IS shown but the winding configuration or the utility source grounding is not stated here, so whether
      the primary neutral must be grounded cannot be decided from the drawing; say exactly that and name
      what is missing. DEFERRED = no transformer is depicted in this batch; give the one-line reason.

      ABSENCE RULE (absence_is = unknown): if a transformer is depicted but its PRIMARY NEUTRAL treatment
      is not indicated, answer Needs Review rather than Fail, because that requirement lives in the interconnection
      agreement and not on the sheet. The single exception is the tank / enclosure bond, which is required
      regardless and is a Fail when absent, as stated in the first line above. SCOPE OF ANY GENERIC ''If
      absent'' LINE RENDERED BELOW THIS INSTRUCTION: it is a default for the neutral-treatment question
      only; it does not reach the tank-bond Fail, and where no transformer appears in this batch at all
      the DEFERRED branch above governs.

      MULTI-INSTANCE: emit ONE FINDING PER TRANSFORMER, with "instance" set to the transformer tag as
      printed. Never merge two transformers, and never merge the primary and secondary answers into one
      row - the secondary is check transformer_secondary_grounding.

      Severity: high for a grounded delta or an unbonded tank, medium otherwise.'
    absence_is: unknown
    nec_ref: Utility interconnection requirement / utility grounding standard (decides primary neutral
      grounding); NEC 250.4(A)(2) and 250.190 (tank and MV equipment bonding). Deliberately NOT 250.30
      (derived/secondary side) and NOT 450.5 (grounding autotransformers - owned by transformer_secondary_grounding).
    aliases:
    - Transformer grounding - primary side
    - Transformer primary grounding connection
    - Transformer primary grounding
    - Transformer grounding primary side
    - Transformer grounding primary/secondary
  - id: transformer_secondary_grounding
    title: Transformer secondary (separately derived system) grounding
    instruction: 'Read the secondary winding configuration and its grounding. A wye secondary supplying
      a separately derived system must have its neutral point connected, at ONE point only, through a
      system bonding jumper (NEC 250.30(A)(1)) and through a grounding electrode conductor to the nearest
      qualifying electrode (NEC 250.30(A)(4) and (A)(5)); the secondary enclosure and downstream equipment
      must be bonded. Confirm the GEC and the system bonding jumper are both SHOWN and connect to the
      right points - their sizing is graded under checks gec_sizing and bonding_jumper_sizing, so do not
      repeat the size arithmetic here. A tap to a common GEC serving several separately derived systems
      (NEC 250.30(A)(6)) counts as a GEC being shown.

      IMPEDANCE GROUNDING. If any impedance grounding is shown - a grounding transformer (zig-zag or wye-delta),
      a neutral grounding resistor or reactor (NGR), or a high-resistance grounding arrangement - confirm
      its rating is SPECIFIC (ohms or let-through amperes, time rating, and kVA where applicable) rather
      than a generic ''NGR'' bubble; a rating shown as TBD or omitted is a Fail. The governing article
      for an impedance-grounded system OVER 1000 V is NEC 250.187; NEC 250.36 applies only to 480 V through
      1000 V high-impedance grounded neutral systems - cite the one matching the voltage you actually
      read. Where the device is a grounding AUTOTRANSFORMER (zig-zag) used to derive a neutral for grounding
      a 3-phase 3-wire system, NEC 450.5 governs it: confirm its continuous neutral current rating (450.5(A)(1))
      and its overcurrent protection (450.5(A)(4)) are called out, not just the ohms.

      UNGROUNDED AND CORNER-GROUNDED SECONDARIES - make the note testable, not persuasive. For an UNGROUNDED
      secondary, the note must BOTH state that the ungrounded configuration is intentional AND identify
      the ground-detection / ground-fault-indication means required by NEC 250.21(B) for an ungrounded
      system operating at 120 V to 1000 V; a configuration label alone (for example "UNGROUNDED DELTA")
      is not sufficient. For a CORNER-GROUNDED delta - which is a GROUNDED system under NEC 250.26(4),
      not an ungrounded one - do NOT demand ground detectors; require instead a note stating the configuration
      is intentional and identifying WHICH phase conductor is the grounded conductor.

      FAIL = a wye secondary with no neutral-to-ground connection or no GEC shown, a neutral-to-ground
      bond at more than one point (subject to the 250.30(A)(1) exception described in check bonding_jumper_sizing),
      an impedance-grounding device with no specified rating, a zig-zag grounding autotransformer with
      no 450.5(A)(1) neutral current rating or no 450.5(A)(4) overcurrent protection shown, or an ungrounded
      / corner-grounded secondary shown without the note content required above. PASS = configuration
      labeled, bond at exactly one point (or the 250.30(A)(1) exception properly applied), GEC shown,
      any impedance device rated. NEEDS REVIEW = the winding configuration or the grounding connection
      is drawn but not legible. DEFERRED = no transformer is depicted in this batch; give the one-line
      reason.

      ABSENCE RULE (absence_is = defect): a depicted wye secondary with no grounding shown IS the defect
      - Fail it, do not go quiet. SCOPE OF ANY GENERIC ''If absent'' LINE RENDERED BELOW THIS INSTRUCTION:
      that line governs an item missing from a transformer that IS depicted here - report Fail. Where
      no transformer appears in this image batch at all, the DEFERRED branch above governs and takes precedence
      over the generic line.

      MULTI-INSTANCE: emit ONE FINDING PER TRANSFORMER, with "instance" set to the tag as printed. Never
      merge two transformers into one row.

      Severity: high.'
    absence_is: defect
    nec_ref: NEC 250.30(A)(1) and its Exception (system bonding jumper), 250.30(A)(4) and (A)(5) (electrode
      and GEC), 250.30(A)(6) (common GEC and taps), 250.20(D), 250.21(B) (ground detection on ungrounded
      systems), 250.26(4) (corner-grounded delta); NEC 250.36 (high-impedance grounded neutral, 480-1000
      V) or NEC 250.187 (impedance grounded systems over 1000 V) as the voltage dictates; NEC 450.5, including
      450.5(A)(1) and 450.5(A)(4) (grounding autotransformers / zig-zag)
    aliases:
    - Transformer secondary grounding connection
    - Transformer grounding - secondary side
  - id: inverter_equipment_bonding_continuity
    title: Inverter, skid and row-to-row equipment bonding continuity
    instruction: 'Confirm each inverter, inverter skid and row-to-row bonding jumper is bonded to the
      grounding system by a means that is actually shown: a drawn conductor with a size callout, or an
      explicitly noted equipment grounding path (a metallic raceway or cable armor of a type listed as
      an equipment grounding conductor in NEC 250.118, or a mounting / support system listed, labeled
      and identified for bonding under NEC 690.43(A), or a metallic support structure with identified
      bonding jumpers or itself identified as an equipment grounding conductor under NEC 690.43(B)). Bonding
      assumed silently through an enclosure, with neither a conductor nor a note, is not acceptable. But
      do NOT Fail a design that states its path in a note: 250.118 permits several non-wire equipment
      grounding conductors, and 690.43(A) and (B) permit listed mounting systems and identified metallic
      supports, so demanding a drawn wire everywhere is a false Fail.

      FAIL = an inverter, skid or row shown with no bonding conductor AND no stated grounding path, or
      a bonding conductor drawn with no size callout. PASS = every inverter, skid and row has a stated,
      sized or listed path; name the means and the provision it relies on. NEEDS REVIEW = a bond is drawn
      but its size or its termination point is illegible. DEFERRED = no inverter, skid or row bonding
      is depicted in this batch; give the one-line reason.

      ABSENCE RULE (absence_is = defect): an inverter depicted on these sheets with nothing bonding it
      is the defect - Fail it. SCOPE OF ANY GENERIC ''If absent'' LINE RENDERED BELOW THIS INSTRUCTION:
      that line governs an item missing from equipment that IS depicted here - report Fail. Where no inverter,
      skid or row appears in this image batch at all, the DEFERRED branch above governs and takes precedence
      over the generic line.

      MULTI-INSTANCE: emit ONE FINDING PER INVERTER OR ROW that fails, with "instance" set to the tag
      as printed (for example "INV-04", "Row 12-13 jumper"). Never merge several unbonded units into one
      row.

      Severity: high if unbonded, medium if bonded but unsized.'
    absence_is: defect
    nec_ref: NEC 250.96(A), 250.118, 250.134; NEC 690.43(A) (listed and identified module mounting / bonding
      devices) and 690.43(B) (metallic support structures with identified bonding jumpers or identified
      as equipment grounding conductors)
    aliases:
    - Inverter equipment grounding continuity
