  - id: equipment_pad_grounding_layout
    title: Equipment pad grounding layout and connection details
    instruction: 'Read the pad grounding detail and confirm it shows HOW the ring, the rods, the pad reinforcing
      steel and each piece of pad-mounted equipment (transformer, switchgear, inverter skid, MV gear)
      connect to the grounding system, and that the connection METHOD is called out. Buried and concrete-encased
      connections must be made by exothermic welding or a listed irreversible compression connector, and
      all grounding connections must use listed means; a connector used on a buried electrode must also
      be listed for direct soil burial or concrete encasement (NEC 250.70). Grounding electrode conductor
      connections must be accessible, except that an encased or buried connection to a concrete-encased,
      driven or buried electrode is not required to be accessible (NEC 250.68(A) and its Exception No.
      1). Where the pad reinforcing steel qualifies as a concrete-encased electrode (NEC 250.52(A)(3):
      at least 20 ft of 1/2 in. or larger bare rebar, or 20 ft of 4 AWG bare copper, encased in at least
      2 in. of concrete in direct earth contact), confirm it is connected rather than ignored; a rebar-type
      concrete-encased electrode may be extended from within the concrete to an accessible point above
      it under NEC 250.68(C)(3).

      FAIL = a piece of pad-mounted equipment with no grounding connection drawn, a connection shown with
      no method called out, or a rebar / Ufer electrode present in the detail but left unconnected. PASS
      = every pad item connected and the connection methods stated; name them. NEEDS REVIEW = the detail
      is present but too coarse to tell which items are connected. DEFERRED = no equipment pad or pad
      grounding detail appears in this image batch; give the one-line reason.

      ABSENCE RULE (absence_is = defect): a pad shown with equipment on it and no grounding connections
      drawn is the defect - Fail it. SCOPE OF ANY GENERIC ''If absent'' LINE RENDERED BELOW THIS INSTRUCTION:
      that line governs an item missing from a pad that IS depicted here - report Fail. Where no pad and
      no pad grounding detail appears in this image batch at all, the DEFERRED branch above governs and
      takes precedence over the generic line.

      MULTI-INSTANCE: emit one finding per pad, or per unconnected item where several differ, with "instance"
      set to the equipment or pad tag as printed.

      Severity: high for equipment left unconnected or an unconnected Ufer electrode, low for a missing
      connection-method callout.'
    absence_is: defect
    nec_ref: NEC 250.52(A)(3), 250.68(A) and its Exception No. 1 (accessibility), 250.68(C)(3) (extending
      the connection from a rebar-type concrete-encased electrode), 250.70 (connection means and direct-burial
      listing), 250.190
    aliases:
    - Equipment pad grounding layout
    - Equipment pad grounding ring and rod details
  - id: fence_and_perimeter_grounding
    title: Perimeter fence grounding, bonding or explicit isolation
    instruction: 'Where the perimeter fence appears on these sheets, confirm EITHER (a) fence grounding
      and bonding is shown - fence posts bonded at the stated interval, bonding jumpers across each gate
      hinge and across the gate leaf so a swinging gate cannot become isolated, and the fence bonded to
      the station grounding network, per NEC 250.194 - OR (b) fence ISOLATION is explicitly noted, with
      the isolation method or clearance stated. Whichever is shown must agree with the fence-grounding
      note carried on the site plan; silence is not an answer.

      WHEN ISOLATION IS NOT AN OPTION: NEC 250.194 requires metal fences enclosing, and other metal structures
      in or surrounding, a substation with EXPOSED electrical conductors and equipment to be grounded
      and bonded to limit step, touch and transfer voltages. Isolation is an acceptable answer ONLY where
      the fence does not enclose exposed energised conductors or equipment - typically a fence around
      dead-front, pad-mounted gear. Where the fence encloses a substation or yard with EXPOSED MV conductors
      or equipment, 250.194 REQUIRES grounding and bonding, and an isolation note is a FAIL, not an alternative.
      State which case you read and what you read it from.

      FAIL = a fence shown enclosing exposed MV conductors or equipment with an isolation note instead
      of bonding, a fence shown enclosing MV equipment with neither bonding nor an isolation note, gates
      with no bonding jumper where the rest of the fence is bonded, or a fence treatment that contradicts
      the site-plan fence-grounding note. PASS = bonding is shown where 250.194 applies, or isolation
      is explicitly stated in a case where 250.194 does not apply, and the treatment is internally consistent;
      say which one and why it applies. NEEDS REVIEW = a fence-grounding note exists but its extent (which
      runs, which gates), or whether the enclosed equipment is dead-front or exposed, cannot be read from
      these images. DEFERRED = no fence and no fence-grounding note appears in these images; give the
      one-line reason "fence not depicted on the supplied grounding sheets".

      ABSENCE RULE (absence_is = not_applicable): most grounding-sheet batches do not include the fence,
      so its absence from the batch is a scope statement rather than a defect - answer Deferred as above;
      do not answer nothing, and do not Fail. SCOPE OF ANY GENERIC ''If absent'' LINE RENDERED BELOW THIS
      INSTRUCTION: it is a default; this check''s own Deferred trigger above governs.

      MULTI-INSTANCE: if several fence sections or gates differ, emit one finding per section or gate
      with "instance" set as printed.

      Severity: medium; high where the fence encloses exposed energised medium-voltage conductors or equipment
      with no bonding.'
    absence_is: not_applicable
    nec_ref: NEC 250.194 (grounding and bonding of metal fences and structures around substations with
      exposed conductors and equipment); firm QC checklist - Site Plan fence-grounding note
    aliases:
    - Fence grounding isolation panel and perimeter grounding
  - id: nec_code_references_shown
    title: NEC code references cited on the grounding sheets
    instruction: 'Confirm the grounding sheets state the code basis for what they require: the NEC articles
      relied on - 250.66 for the grounding electrode conductor, 250.122 for equipment grounding conductors,
      250.102(C)(1) for bonding jumpers, 250.52 and 250.53 for the electrodes, 690.43 and 690.45 for the
      PV array - cited next to the sized conductors or collected in the grounding notes, AND the NEC edition
      or code year stated somewhere on the sheet or in the general notes.

      FAIL = conductor sizes or electrode requirements given with no code basis stated anywhere on the
      sheet; or a cited article that does not govern the item it is attached to (for example 250.66 cited
      beside an equipment grounding conductor, or 250.30 cited beside a transformer PRIMARY grounding
      note); or the sheet states no NEC edition or code year anywhere on it or in the general notes. PASS
      requires BOTH: the relevant article citations, each attached to the right item, AND a stated NEC
      edition or code year; quote two or three of the citations and the code year you found. NEEDS REVIEW
      = notes are present but partially illegible.

      ABSENCE RULE (absence_is = defect): the absence of code references IS the entire subject of this
      check. If none are shown, answer FAIL - this check has NO Deferred branch, and the generic ''If
      absent'' line rendered below this instruction applies to it without qualification. Never Deferred,
      never silence.

      MULTI-INSTANCE: emit one finding per wrongly-cited or uncited item where several differ, with "instance"
      set to the note number or the item tag as printed; the missing code year is a single finding for
      the sheet.

      Severity: low where references are simply absent; low for a missing code year (it changes no conductor
      size but leaves the sheet undatable against a code cycle); medium where a cited article is wrong
      for the item it labels, since a wrong citation is worse than no citation and will be relied on in
      the field.'
    absence_is: defect
    nec_ref: 'Firm QC checklist - Labels: NEC references; QC checklist Grounding Diagram code-reference
      callouts; NEC edition / code year statement on the sheet'
    aliases:
    - Code references shown
    - Code references shown on grounding diagram
    - Code reference callouts shown
    - NEC code references shown on plans
    - Code references shown on grounding sheets
    - NEC article references shown on plans
    - Code references on grounding sheet
    - Code reference completeness on grounding diagram
    - NEC code references shown
    - NEC code references shown on grounding diagram
guidance:
  grounding: 'MULTI-INSTANCE RULE (applies to EVERY check above, not only the ones that repeat it). One
    check id may legitimately fire several times on one sheet. When a check finds several offenders -
    three transformers, two feeders, four inverters - emit ONE FINDING PER OFFENDER and set the optional
    "instance" field to the equipment tag exactly as printed on the drawing ("XFMR-1", "XFMR-2", "INV-04",
    "CAB-3 -> DCB-1"). If nothing on the drawing names the offender, use a short positional descriptor
    from the sheet ("north pad", "row 12-13 jumper"). Never merge several offenders into one row and never
    report only the first: a field crew corrects them separately, and a merged row cannot be partially
    cleared on the next revision.


    ANSWER EVERY CHECK. There is no skip. If a check''s subject is genuinely out of scope for this planset
    or this image batch, answer it with status "Deferred" and a one-line reason - a reader must always
    be able to tell "clean" from "never checked". Each check above carries an ABSENCE RULE stating, for
    that check specifically, whether a missing subject is a Fail (the absence is the defect), a Deferred
    (genuinely not applicable or not in this batch), or a Needs Review (cannot be distinguished from a
    subject drawn on a sheet outside this batch). Follow that check''s own rule; do not generalise one
    check''s rule to another, and where a generic "If absent" line is rendered under an instruction, the
    check''s own stated ladder governs.


    "open_findings" IS THE COVERAGE ESCAPE HATCH AND IT IS REQUIRED, NOT OPTIONAL. Use it for a real GROUNDING
    defect that is visible on these sheets and that none of the 15 check_ids above owns. Grounding-specific
    classes to look for, none of which any enumerated check covers:

    - GEC INSTALLATION AND ROUTING under NEC 250.64, which no id above owns: an aluminium or copper-clad-aluminium
    GEC in contact with earth or within 18 in. of earth, or used outdoors within 18 in. of grade (250.64(A));
    a GEC left unprotected where exposed to physical damage (250.64(B)); a GEC spliced by anything other
    than exothermic welding or a listed irreversible compression connector, or not run in one continuous
    length (250.64(C)); a ferrous metal raceway or enclosure around a GEC not made electrically continuous
    and not bonded at BOTH ends to the GEC (250.64(E)); tap arrangements to a common GEC at multiple enclosures
    (250.64(D)).

    - SURGE AND LIGHTNING PROTECTION GROUNDING: surge-arrester or SPD ground leads not bonded to the same
    grounding electrode system, air-terminal / LPS down-conductors not bonded to the electrical grounding
    electrode system, or an SPD ground conductor routed with sharp bends or excessive length contrary
    to the manufacturer''s listing.

    - SOIL-RESISTIVITY AND GROUND-GRID STUDY CONFLICTS: a stated soil resistivity, ground-grid resistance
    target, or step-and-touch-potential study value that contradicts the electrode arrangement actually
    drawn (for example a 5-ohm target with two rods and no ring), or a grid design referenced by note
    with no supporting values on the sheets.

    - CONCRETE-ENCASED (UFER) ELECTRODE issues outside the equipment-pad detail - a qualifying rebar electrode
    in a foundation, pier or pile shown on a structural or civil detail in this batch and not connected
    to the grounding electrode system.

    - DISSIMILAR-METAL AND CORROSION PROTECTION at buried connections: copper landed directly on galvanised
    or plain steel with no bimetallic transition, no listed dissimilar-metal connector, and no corrosion-protection
    note.

    - MEDIUM-VOLTAGE CABLE SHIELD AND NEUTRAL GROUNDING: MV cable shields or concentric neutrals shown
    terminated at only one end with no note stating the grounding scheme, or shield grounding omitted
    entirely at a termination.

    - DC-SIDE ARRAY GROUNDING CONFIGURATION not covered above: a functionally grounded or ungrounded PV
    array whose ground-fault detection / interruption arrangement (NEC 690.41(B)) is drawn or noted inconsistently
    with the inverter listing.

    - INTERNAL CONTRADICTION AND DOCUMENT CONTROL: a grounding note that contradicts another note or a
    detail on a different sheet in this batch, a detail callout that points to a detail not present, or
    a stale revision block or superseded revision cloud on the grounding detail.

    Give each entry a short descriptive name in the "check" field (a "title" field is also accepted by
    the parser) - never leave it unnamed and never let it be numbered positionally. Quote the sheet and
    the text or dimension you read, exactly as for an enumerated check.


    DO NOT DUPLICATE AN ENUMERATED CHECK HERE. If the defect you are about to write is already owned by
    one of the 15 ids above - an undersized EGC (egc_sizing), a GEC sized against the table over a 250.66
    limiter (gec_sizing), a bonding jumper below Note 2''s 12.5 percent (bonding_jumper_sizing), rod spacing
    or a missing supplemental electrode (ground_rods_presence_and_spacing), ring size, depth or continuity
    (ground_ring_size_and_continuity), a missing tank bond (transformer_primary_grounding), a missing
    or wrong code citation (nec_code_references_shown) - report it UNDER THAT CHECK ID, not here, even
    if you would phrase it differently. Restating an enumerated finding in open_findings is counted as
    a duplicate and defeats the purpose of the fixed ids. Open findings are for subjects the 15 ids cannot
    reach. If nothing qualifies, return "open_findings": [].'
