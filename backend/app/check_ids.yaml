families:
  grounding:
  - id: full_grounding_path_rack_to_poi
    title: Grounding path continuity across the supplied sheets (rack to POI)
    instruction: 'Trace the equipment-grounding / bonding path in the order module and rack -> CAB ->
      DCB / inverter -> AC panel or switchgear -> transformer -> POI, using ONLY the segments visible
      in the images you were given. You are handed at most three grounding sheets and the path frequently
      continues onto sheets that are not in this batch. FAIL only when a break, dead end or unlabeled
      segment lies between two points that are BOTH visible in these images; quote the two points. When
      the trace runs off the batch, do NOT call it a gap: answer Needs Review, name the sheet number or
      title where the trace leaves the supplied images, and name the last device you could confirm.

      PASS = every segment between visible endpoints is drawn and labeled AND the trace is complete from
      the rack to the POI within these images. FAIL = a break, dead end or unlabeled segment between two
      endpoints that are both visible here. NEEDS REVIEW = the trace leaves the supplied images, or a
      segment is drawn but its label or termination is illegible. DEFERRED = the images you were given
      contain no grounding-path content of any kind - on their face they are only a note sheet, a schedule
      or an isolated detail, with no grounding one-line, riser or plan; name the sheets you were given.

      PRECEDENCE (these branches would otherwise be satisfiable at the same time, and this family is routinely
      handed only three sheets while the trace spans rack to POI): if every segment between visible endpoints
      checks out BUT the trace leaves the supplied images, the answer is NEEDS REVIEW (scope-limited)
      - name the exit sheet and the last confirmed device. Answer PASS only when the trace is complete
      and labeled from the rack all the way to the POI within these images. FAIL outranks both: a break
      between two visible endpoints is a Fail even where the trace also leaves the batch somewhere else.

      ABSENCE RULE (absence_is = unknown): if you cannot see enough of the path to judge continuity, answer
      Needs Review and name what you could not see. Never assume continuity, never Pass by default, and
      never answer nothing. SCOPE OF ANY GENERIC ''If absent'' LINE RENDERED BELOW THIS INSTRUCTION: it
      is a default for checks that state no rule of their own. This check states its own ladder and PRECEDENCE
      line above, and those govern wherever the two differ.

      MULTI-INSTANCE: if several distinct breaks exist, emit one finding per break with the optional "instance"
      field set to the two endpoints (for example "CAB-2 -> INV-2"); do not merge them into one row. Severity:
      high for a break between two visible endpoints, medium for an unlabeled segment.'
    absence_is: unknown
    nec_ref: NEC 250.4(A)(2), 250.118, 250.134; firm QC checklist - Grounding Diagram item 1 (full circuit
      trace, rack to POI)
    aliases:
    - Overall circuit trace from PV rack to POI
    - PV rack to AC equipment grounding path
    - PV rack to inverter/DC equipment grounding path
  - id: pv_rack_module_egc_to_cab
    title: PV module / rack equipment grounding conductor to the combiner
    instruction: 'Read the EGC size and material printed between the module frames / racking and the combiner
      (CAB), and read the module-to-rack bonding method (WEEB, listed lug, integrated grounding clip,
      or racking listed and identified as an equipment grounding path under NEC 690.43(A) and (B)). Confirm
      (a) a conductor size is actually called out, (b) the bonding method is stated rather than implied,
      and (c) the size is not smaller than NEC Table 250.122 requires for the OCPD protecting that circuit.
      Use the full copper and aluminium table quoted in check egc_sizing; a PV equipment grounding conductor
      is sized by 250.122 through NEC 690.45 and shall not be smaller than 14 AWG. Grade an aluminium
      conductor against the aluminium column and a copper conductor against the copper column.

      NO OCPD IN THE CIRCUIT - NEC 690.45: where the PV source or PV output circuit has no overcurrent
      device at all (common on unfused string circuits), do NOT answer Needs Review. Use an assumed overcurrent
      device rated per NEC 690.9(B) on the circuit''s maximum current when applying Table 250.122, state
      in the evidence that you assumed it and what value you used, and complete the lookup. Reserve Needs
      Review for a circuit that clearly HAS an OCPD whose rating you cannot read.

      VOLTAGE-DROP EXEMPTION - NEC 690.45: on PV SOURCE and PV OUTPUT circuits (module / string to CAB),
      increases in EGC size to address VOLTAGE DROP are NOT required. Do not Fail a DC circuit whose current-carrying
      conductors are upsized for voltage drop while its EGC stays at the plain Table 250.122 size. NEC
      250.122(B) still applies in full to AC circuits, and to DC circuits upsized for a reason other than
      voltage drop.

      ROUTING - NEC 690.43(C): the array EGC must be contained within the same raceway or cable as, or
      otherwise run with, the PV array circuit conductors where those conductors leave the vicinity of
      the array. Where these sheets PLAINLY show the EGC leaving the array on a separate route from the
      array circuit conductors, that is a Fail under 690.43(C); do NOT infer a separate route from the
      mere absence of a routing detail.

      FAIL = a grounding conductor drawn with no size callout, a size below the applicable Table 250.122
      column for the protecting (or assumed) OCPD, a module-to-rack bond with no stated method, or a plainly
      separate array-EGC route under 690.43(C). PASS = size, material and bonding method are all stated
      and the size meets the table; show the lookup. NEEDS REVIEW = a size is shown but the rating of
      an OCPD that clearly exists is not readable on these sheets so the lookup cannot be completed; say
      which value is missing. DEFERRED = the images you were given contain no DC-side sheet at all (they
      are AC / MV grounding sheets only); name the sheets.

      ABSENCE RULE (absence_is = unknown): a solar planset always has modules and racking, so if the rack-to-CAB
      grounding does not appear in these images you cannot tell whether it is missing from the design
      or lives on a sheet outside this batch. Answer Needs Review, state which sheets you searched, and
      do not Fail. SCOPE OF ANY GENERIC ''If absent'' LINE RENDERED BELOW THIS INSTRUCTION: it is a default;
      this check''s own ladder above governs wherever the two differ, and note that the DEFERRED branch
      here is triggered by a positively observable fact (no DC-side sheet in the batch), not by absence
      of grounding content.

      MULTI-INSTANCE: emit one finding per array block or CAB circuit whose answer differs, with "instance"
      set to the block or CAB tag as printed; never merge several blocks into one row. Severity: high
      if undersized, medium if drawn unsized, medium if the bonding method is unstated, medium for a 690.43(C)
      routing violation.'
    absence_is: unknown
    nec_ref: NEC 690.43(A), (B) and (C), 690.45, 690.9(B) (assumed OCPD where none is used), Table 250.122,
      250.134
    aliases:
    - PV rack to CAB grounding conductor size
    - PV rack grounding conductor size
    - PV module/rack grounding to CAB
    - PV rack to CAB grounding conductor
    - PV module/rack grounding conductor
    - PV module/rack grounding conductor sizing
    - PV rack grounding conductor size (rack to CAB)
    - PV rack grounding to CAB and CAB to DCB/inverter EGC
  - id: cab_to_inverter_egc
    title: CAB to DCB / inverter equipment grounding conductor
    instruction: 'Read the EGC size and material for each segment from the combiner (CAB) to the DC recombiner
      (DCB) and from the DCB to the inverter. Confirm each segment carries its own size callout and that
      the size satisfies NEC Table 250.122 for the OCPD protecting that segment; use the full copper and
      aluminium table quoted in check egc_sizing, and grade aluminium against the aluminium column. A
      size that steps DOWN as the circuit moves toward a LARGER upstream OCPD is a Fail unless the drawing
      states that the smaller conductor is protected by a smaller OCPD.

      NO OCPD IN THE SEGMENT - NEC 690.45: where a PV output circuit segment has no overcurrent device
      at all, do NOT answer Needs Review; use an assumed overcurrent device rated per NEC 690.9(B) on
      that circuit''s maximum current when applying Table 250.122, state the assumption and the value
      used, and complete the lookup.

      VOLTAGE-DROP EXEMPTION - NEC 690.45: these are PV output circuits, so increases in EGC size to address
      VOLTAGE DROP are NOT required. Do not Fail a CAB -> DCB or DCB -> inverter run whose current-carrying
      conductors are upsized for voltage drop while its EGC remains at the plain Table 250.122 size. NEC
      250.122(B) still applies to a DC circuit upsized for some other reason, and in full to the AC side.

      FAIL = a missing size callout on a drawn segment, a size below the applicable table column, or an
      unexplained step-down. PASS = each segment sized, material stated, at or above the table row; show
      the lookup. NEEDS REVIEW = an OCPD that clearly protects a segment is not readable in these images.
      DEFERRED = the images you were given contain no DC-side sheet at all (they are AC / MV grounding
      sheets only); name the sheets.

      ABSENCE RULE (absence_is = unknown): if the CAB -> DCB -> inverter grounding is simply not depicted
      here, answer Needs Review naming the sheets you searched. Do not Fail and do not stay silent. SCOPE
      OF ANY GENERIC ''If absent'' LINE RENDERED BELOW THIS INSTRUCTION: it is a default; this check''s
      ladder governs where the two differ, and the DEFERRED branch here is triggered by the positively
      observable absence of any DC-side sheet, not by the absence of grounding content on one.

      MULTI-INSTANCE: emit one finding per segment whose answer differs, with "instance" set as printed
      (for example "CAB-3 -> DCB-1"); never merge segments. Severity: high if undersized, medium if drawn
      unsized.'
    absence_is: unknown
    nec_ref: NEC 690.45, 690.9(B) (assumed OCPD where none is used), Table 250.122, 250.122(A)
    aliases:
    - CAB/rack to inverter DC grounding conductor
    - EGC from CAB to DCB/inverter
    - CAB to DCB/inverter grounding conductor size
    - CAB/combiner to inverter grounding conductor size
  - id: dc_grounding_matches_dc_sld
    title: DC grounding section agrees with the DC single-line equipment configuration
    instruction: 'Compare the equipment appearing in the DC grounding section - CAB quantity and tags,
      DCB quantity and tags, inverter quantity and model, string counts - against the DC single-line information
      actually available to you in THESE images: an embedded mini one-line, an equipment schedule, a keyed
      note, or a device list on the grounding sheet.

      FAIL = a device is grounded here that does not exist on the DC one-line, a device on the one-line
      has no grounding shown, or a quantity, tag or model disagrees; quote BOTH values you compared. PASS
      = every device, tag and quantity agrees; name what you compared. NEEDS REVIEW = a tag, model or
      quantity is partially legible so the comparison cannot be completed. DEFERRED = no DC single-line,
      equipment schedule or device list is present in the images you were given, so there is nothing to
      compare against; give the one-line reason "DC single-line not in this image batch".

      ABSENCE RULE (absence_is = not_applicable): the Deferred trigger for this check is the absence of
      the COMPARISON SOURCE from this image batch, not the absence of equipment from the design. Do not
      reconstruct the one-line from memory of other sheets and do not answer nothing. SCOPE OF ANY GENERIC
      ''If absent'' LINE RENDERED BELOW THIS INSTRUCTION: it is a default worded around equipment that
      does not exist; this check''s own Deferred trigger above governs.

      MULTI-INSTANCE: emit one finding per mismatched device with "instance" set to the device tag as
      printed; never merge several mismatches into one row. Severity: medium for a quantity or tag mismatch,
      high where an entire inverter, CAB or DCB has no grounding shown.'
    absence_is: not_applicable
    nec_ref: NEC 690.43, 250.134; firm QC checklist - DC Line Diagram grounding callouts
    aliases:
    - DC grounding section matches equipment configuration
    - DC equipment grounding configuration vs SLD
    - DC grounding section matches inverter configuration
    - DC grounding section matches DC SLD configuration
    - DC equipment grounding consistency with DC SLD
    - DC grounding section matches equipment configuration on DC SLD
    - DC equipment grounding configuration
    - DC equipment grounding configuration consistency with SLD
    - DC equipment grounding configuration vs single-line equipment
  - id: egc_sizing
    title: Equipment grounding conductor sizing (NEC 250.122)
    instruction: 'For every circuit shown on these sheets, read the rating of the overcurrent device protecting
      it and the EGC size and material printed for it, then look the size up in NEC Table 250.122 and
      put the whole lookup in the evidence in the form: "OCPD = 400 A -> Table 250.122 requires 3 AWG
      Cu or 1 AWG Al -> drawing shows 4 AWG Cu -> FAIL (undersized)".

      TABLE 250.122 - OCPD rating (A): minimum copper / minimum aluminium. Sizes are AWG unless kcmil
      is stated.

      15: 14 / 12 | 20: 12 / 10 | 60: 10 / 8 | 100: 8 / 6 | 200: 6 / 4 | 300: 4 / 2 | 400: 3 / 1 | 500:
      2 / 1/0 | 600: 1 / 2/0 | 800: 1/0 / 3/0 | 1000: 2/0 / 4/0 | 1200: 3/0 / 250 kcmil | 1600: 4/0 /
      350 kcmil | 2000: 250 kcmil / 400 kcmil | 2500: 350 kcmil / 600 kcmil | 3000: 400 kcmil / 600 kcmil
      | 4000: 500 kcmil / 750 kcmil | 5000: 700 kcmil / 1200 kcmil | 6000: 800 kcmil / 1200 kcmil.

      Use the row for the OCPD rating; where the OCPD rating falls between rows, use the NEXT HIGHER row.
      Grade an aluminium conductor against the aluminium column and a copper conductor against the copper
      column - this firm''s callouts are frequently AL, and grading an aluminium conductor against the
      copper column is the single most common way this check goes wrong (a 350 kcmil AL EGC on a 2500
      A feeder looks compliant against the copper column and is actually undersized; 600 kcmil AL is required).

      NEC 250.122(A): the EGC need not be larger than the circuit conductors.

      NEC 250.122(B), 2020 wording: where the ungrounded conductors are increased in size from the minimum
      that has sufficient ampacity for the installation FOR ANY REASON (voltage drop, future capacity,
      standardisation, a parallel arrangement, anything), the wire-type EGC must be increased in size
      PROPORTIONALLY to the circular-mil area of the ungrounded conductors. If the drawing shows upsized
      phase conductors and an EGC still at the plain table size, that is a Fail; state the circular-mil
      ratio you applied.

      EXCEPTION TO 250.122(B) - NEC 690.45: for PV SOURCE and PV OUTPUT circuits (the DC side: module
      / string to CAB, CAB to DCB, DCB to inverter), increases in EGC size to address VOLTAGE DROP are
      NOT required. Do NOT Fail a DC circuit whose current-carrying conductors are upsized for voltage
      drop and whose EGC is at the plain Table 250.122 size. 250.122(B) still applies in full to AC circuits
      (inverter output, transformer secondary, service and feeder conductors), and it still applies to
      a DC circuit upsized for a reason OTHER than voltage drop.

      DETERMINISM RULE FOR 250.122(B) - do not guess at an upsize: apply 250.122(B) ONLY where these sheets
      state, or a schedule shows, BOTH the minimum required ampacity and the larger size actually used
      (a voltage-drop note, a future-capacity note, or an ampacity column beside a larger callout). If
      you cannot see evidence that the ungrounded conductors were increased above the minimum, do NOT
      infer an upsize from a large conductor on a modest OCPD - grade against the plain Table 250.122
      row and say in the evidence that no upsize evidence was visible.

      NEC 250.122(F): where the phase conductors are run in parallel in SEPARATE raceways or cables, a
      full-size EGC sized for the circuit OCPD must be run in EACH raceway; parallel conductors in a SINGLE
      raceway need only one EGC. Do not demand one EGC per conductor.

      WHERE NO OCPD EXISTS - NEC 690.45: on a PV source or output circuit with no overcurrent device at
      all, use an assumed overcurrent device rated per NEC 690.9(B) when applying Table 250.122, and state
      the assumption; a PV EGC is never smaller than 14 AWG.

      FAIL = a conductor smaller than the applicable column, a missing 250.122(B) proportional upsize
      where the determinism rule above is satisfied, or a grounding conductor drawn with no size callout.
      PASS = size read, material identified, lookup shown, size at or above the table. NEEDS REVIEW =
      the conductor size or the OCPD rating is illegible or not stated on these sheets so the lookup cannot
      be completed; say WHICH one is missing. DEFERRED = no EGC-carrying circuit is depicted anywhere
      in this batch; give the one-line reason.

      ABSENCE RULE (absence_is = defect): a grounding conductor drawn with no size callout IS the defect
      this check exists to catch - Fail it, do not go quiet and do not downgrade it to Needs Review. Only
      the complete absence of any circuit from the batch is Deferred. SCOPE OF ANY GENERIC ''If absent''
      LINE RENDERED BELOW THIS INSTRUCTION: that line governs an item missing from a circuit or system
      that IS depicted on these sheets (a drawn feeder with no EGC callout) - report Fail. Where the whole
      subject class is absent from this image batch, the DEFERRED branch above governs and takes precedence
      over the generic line.

      MULTI-INSTANCE: emit ONE FINDING PER CIRCUIT that fails, with "instance" set to the circuit or equipment
      tag as printed (for example "INV-2 AC feeder", "MV riser"). Never merge several undersized circuits
      into one row - a field crew corrects them separately and a merged row cannot be partially cleared.

      Severity: high for undersized, medium for a missing size callout, low for a notation ambiguity that
      does not change the size.'
    absence_is: defect
    nec_ref: NEC Table 250.122; 250.122(A), 250.122(B), 250.122(F); 690.45 (PV EGC sizing, the assumed-OCPD
      rule via 690.9(B), and the voltage-drop exemption on PV source and output circuits)
