  - id: ground_ring_size_and_continuity
    title: Ground ring conductor size, length, burial depth and continuity
    instruction: 'Where a ground ring is shown - typically encircling the equipment pad or MV skid - grade
      it against the CODE MINIMUMS, which are the Fail thresholds. The ''commonly #2 through 4/0 bare
      copper'' range is CONTEXT ONLY and must never be used as a threshold; it is a description, and two
      runs applying it will disagree.

      THRESHOLDS: NEC 250.52(A)(4) requires a ring of BARE COPPER conductor not smaller than 2 AWG and
      at least 20 ft (6.0 m) in length, encircling the structure and in direct contact with the earth.
      NEC 250.53(F) requires it to be buried not less than 30 in. (750 mm) below grade. Confirm in addition
      that the ring is a CLOSED loop, that it connects to the ground rods and to the site grounding network,
      and that its connections are exothermic welds or listed irreversible compression fittings, listed
      for direct soil burial where buried (NEC 250.70).

      THE 20 FT LENGTH IS SATISFIABLE BY INSPECTION. A ring is drawn to scale around a pad and almost
      never annotated with a total conductor length. Where the ring is drawn as a closed loop encircling
      equipment whose plan dimensions plainly exceed 20 ft of perimeter, treat the 20 ft minimum as satisfied,
      say so in the evidence, and do NOT require a stated length. Require a stated length - answering
      Needs Review without one - only where the loop is small enough that 20 ft is genuinely in doubt,
      or the detail is explicitly not to scale.

      DISJOINT STATUS BRANCHES (a ring drawn without a size callout must land on exactly one of these):
      FAIL = the ring is drawn with no CONDUCTOR SIZE OR MATERIAL callout, or a size or material below
      2 AWG bare copper, or a stated burial depth under 30 in., or a stated length under 20 ft, or the
      loop is shown open or discontinuous. NEEDS REVIEW = conductor size AND material ARE called out and
      meet the minimum, but the burial depth is not stated anywhere in these images, or the length is
      not stated in the one case where 20 ft is genuinely in doubt; say WHICH value is missing. PASS =
      2 AWG bare copper or larger, depth stated at or above 30 in., length stated or satisfied by inspection,
      loop closed and connected; quote the values you read. FAIL outranks NEEDS REVIEW where both could
      be argued.

      ABSENCE RULE (absence_is = not_applicable): a ground ring is NOT required by the NEC where another
      electrode system is provided. If no ring is shown and ground rods or a concrete-encased electrode
      ARE, answer DEFERRED with a one-line reason naming the electrode system actually used. The ''no
      electrode of any kind'' case belongs to check ground_rods_presence_and_spacing and must not be reported
      twice under two keys. SCOPE OF ANY GENERIC ''If absent'' LINE RENDERED BELOW THIS INSTRUCTION: it
      is a default; this check''s own Deferred trigger above governs.

      MULTI-INSTANCE: if more than one pad or ring is shown, emit one finding per ring with "instance"
      set to the pad or equipment tag as printed.

      Severity: high for undersized, wrong material or an open loop, medium for a missing depth or length
      callout.'
    absence_is: not_applicable
    nec_ref: NEC 250.52(A)(4), 250.53(F), 250.66(C), 250.70
    aliases:
    - Grounding ring presence and size
    - Grounding ring conductor size
    - Grounding ring conductor size and connection to rods
