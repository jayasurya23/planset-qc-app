  - id: bonding_jumper_sizing
    title: Main and system bonding jumper sizing and single-point neutral-to-ground bond
    instruction: "Two distinct items, both sized from Table 250.102(C)(1):\n  - the MAIN bonding jumper\
      \ at the service, required by NEC 250.24(B) and constructed and sized per 250.28 (sizing in 250.28(D));\n\
      \  - the SYSTEM bonding jumper at each separately derived system (each transformer secondary), required\
      \ by NEC 250.30(A)(1).\n  250.102(C)(1) supplies only the sizing TABLE - it is not the requirement.\
      \ Cite 250.24(B) and 250.28 at a service, and 250.30(A)(1) at a transformer.\nTABLE 250.102(C)(1)\
      \ - largest ungrounded supply conductor, or the EQUIVALENT AREA FOR PARALLEL CONDUCTORS, -> minimum\
      \ bonding jumper. The rows are the same as Table 250.66:\n  supply 2 AWG Cu or smaller, or 1/0 Al\
      \ or smaller -> 8 AWG Cu / 6 AWG Al\n  1 or 1/0 Cu, or 2/0 or 3/0 Al -> 6 Cu / 4 Al\n  2/0 or 3/0\
      \ Cu, or 4/0 or 250 kcmil Al -> 4 Cu / 2 Al\n  over 3/0 through 350 kcmil Cu, or over 250 through\
      \ 500 kcmil Al -> 2 Cu / 1/0 Al\n  over 350 through 600 kcmil Cu, or over 500 through 900 kcmil\
      \ Al -> 1/0 Cu / 3/0 Al\n  over 600 through 1100 kcmil Cu, or over 900 through 1750 kcmil Al ->\
      \ 2/0 Cu / 4/0 Al\n  over 1100 kcmil Cu, or over 1750 kcmil Al -> 3/0 Cu / 250 kcmil Al, AND SEE\
      \ NOTE 2: above these thresholds the governing size is the LARGER of this row and Note 2's 12.5\
      \ percent figure. The table does not stop here.\n  PARALLELED SUPPLY CONDUCTORS: the table's own\
      \ column is \"largest ungrounded supply conductor OR EQUIVALENT AREA FOR PARALLEL CONDUCTORS\",\
      \ so parallel runs are SUMMED per phase for a single main or system bonding jumper (the parallel-conductor\
      \ basis in Table 250.102(C)(1)'s own column heading). Where an individual jumper bonds each raceway\
      \ or cable separately, size each one on the conductors in its own raceway (250.28(D)(3)).\nNOTE\
      \ 1 TO TABLE 250.102(C)(1) - MIXED MATERIALS: if the ungrounded supply conductors and the bonding\
      \ jumper are of DIFFERENT materials (the common case where a copper jumper lands on an aluminium\
      \ bus), do NOT simply read across the row for the supply material. Size the jumper from the row\
      \ for a supply conductor of the JUMPER's material having an ampacity equivalent to the installed\
      \ supply conductors, then take the jumper column for that material. State in the evidence which\
      \ material you assumed and why.\nNOTE 2 TO TABLE 250.102(C)(1) - THE 12.5 PERCENT RULE. This is\
      \ NOTE 2, not Note 1; cite it as Note 2. It is the rule that governs utility-scale collection feeders\
      \ and is the usual source of an under-required answer: where the ungrounded supply conductors are\
      \ LARGER than 1100 kcmil copper or 1750 kcmil aluminium, the bonding jumper shall have an area not\
      \ less than 12.5 percent of the area of the LARGEST ungrounded supply conductor (equivalent area\
      \ where paralleled). Note 2 carries the identical mixed-materials proviso as Note 1 - where the\
      \ jumper and the supply conductors differ in material, take the 12.5 percent on the assumed same-material\
      \ supply conductor of equivalent ampacity. WORKED EXAMPLE: 3 runs of 750 kcmil Cu per phase = 2250\
      \ kcmil equivalent, which exceeds 1100 kcmil, so 0.125 x 2250 = 281.25 kcmil and the jumper must\
      \ be at least the next standard size, 300 kcmil Cu. The table's last row alone would give only 3/0\
      \ Cu (167.8 kcmil), so Note 2 governs here.\nSINGLE-POINT BOND. Confirm the neutral-to-ground bond\
      \ occurs at EXACTLY ONE point per system. A service or separately derived system with no bond shown\
      \ at all is a Fail. EXCEPTION - the NEC 250.30(A)(1) exception permits a system bonding jumper at\
      \ BOTH the source and the first disconnecting means where doing so does not establish a parallel\
      \ path for the grounded conductor (the grounded conductor is then sized not smaller than the system\
      \ bonding jumper). Where the drawing shows bonds at two points, check whether a grounded conductor\
      \ is run between them BEFORE Failing; if it is not, or if a note states the exception is being applied,\
      \ that is a Pass. Connection through the earth is not a parallel path.\nFAIL = a jumper below the\
      \ governing size (the table row, or the LARGER of that row and Note 2's 12.5 percent where Note\
      \ 2 applies), no jumper shown on a depicted service or separately derived system, or more than one\
      \ neutral-to-ground bond in one system where the 250.30(A)(1) exception does not apply. PASS = the\
      \ jumper exists, is sized, and the lookup checks out; show the lookup and say which rule you applied.\
      \ NEEDS REVIEW = the supply conductor size or the jumper size cannot be read on these sheets, or\
      \ bonds appear at two points and you cannot tell whether a grounded conductor runs between them.\
      \ DEFERRED = no service and no separately derived system appears in this batch; give the one-line\
      \ reason.\nABSENCE RULE (absence_is = defect): a missing main or system bonding jumper on a depicted\
      \ service or transformer secondary IS the defect - Fail it, do not go quiet. SCOPE OF ANY GENERIC\
      \ 'If absent' LINE RENDERED BELOW THIS INSTRUCTION: that line governs an item missing from a system\
      \ that IS depicted here - report Fail. Where no service and no separately derived system appears\
      \ in this image batch at all, the DEFERRED branch above governs and takes precedence over the generic\
      \ line.\nMULTI-INSTANCE: emit ONE FINDING PER SYSTEM, with \"instance\" set to the tag as printed\
      \ (\"XFMR-1\", \"XFMR-2\", \"Service 1\"). Never merge two transformers into one row.\nSeverity:\
      \ high."
    absence_is: defect
    nec_ref: NEC 250.24(B) and 250.28, including 250.28(D) and (D)(3) (main bonding jumper at a service,
      paralleled conductors); NEC 250.30(A)(1) and its Exception (system bonding jumper at a separately
      derived system; jumper permitted at both source and first disconnecting means); Table 250.102(C)(1)
      with Note 1 (mixed materials) and Note 2 (the 12.5 percent rule) - sizing only
