  - id: ground_rods_presence_and_spacing
    title: 'Grounding electrode system: rods shown, specified, supplemented and spaced'
    instruction: 'This check owns the question ''is there a grounding electrode system at all, and are
      the rods correctly specified and spaced''. Work the ladder IN ORDER and say which rung you landed
      on.

      (a) ELECTRODE SYSTEM PRESENT? Fail under NEC 250.50 ONLY where these images DO include a grounding
      plan, grounding one-line or electrode detail and no grounding electrode of any type - rods, ground
      ring, concrete-encased / Ufer, plate, or building steel - appears on it. If the batch contains only
      notes, schedules or a detail sheet with NO electrode plan, answer NEEDS REVIEW naming the sheets
      you searched and, where the sheets reference it, the sheet number where the electrode plan lives
      - do not Fail and do not assume compliance. This check is handed at most three sheets and must keep
      the same batch-scope discipline as every other check in this family.

      (b) NO RODS, BUT ANOTHER ELECTRODE IS SHOWN? Answer DEFERRED with a one-line reason naming the electrode
      type actually used. Rods are not mandatory where another qualifying electrode is present.

      (c) ROD SPECIFICATION. Where rods ARE shown: NEC 250.52(A)(5) requires a rod at least 8 ft (2.44
      m) long and, unless listed, not less than 5/8 in. in diameter (this firm''s standard callout is
      5/8 in. x 8 ft copper-clad). NEC 250.53(G) requires at least 8 ft of it in contact with soil, installed
      vertically where practicable, with the upper end flush with or below grade unless protected. A rod
      shown with no specification is a FAIL.

      (d) SPACING - THE THRESHOLD IS 6 FT. NEC 250.53(A)(3) requires multiple rod, pipe or plate electrodes
      to be not less than 6 ft (1.8 m) apart, and 250.53(B) requires 6 ft between electrodes of different
      grounding systems. FAIL ONLY spacing BELOW 6 ft. The ''twice the rod length'' figure (16 ft for
      an 8 ft rod) is an INFORMATIONAL NOTE about paralleling efficiency, NOT a code requirement - a layout
      at 10 ft is CODE COMPLIANT and must not be Failed. You may mention the 2x figure only as a low-severity
      best-practice note attached to an otherwise passing finding, never as the basis of a Fail.

      (e) SUPPLEMENTAL ELECTRODE - NEC 250.53(A)(2): a single rod, pipe or plate electrode must be supplemented
      by an additional electrode, unless the drawing states that the single rod has a resistance to earth
      of 25 ohms or less. A lone rod with no supplement and no 25-ohm note is a FAIL; this is a genuine
      and frequently missed defect.

      FAIL = rung (a) as gated above, or (c), or spacing below 6 ft in (d), or (e). PASS = rods shown,
      specified, spaced at or above 6 ft, and supplemented or noted at 25 ohms or less; quote the spec
      and the dimension you read. NEEDS REVIEW = the batch carries no electrode plan at all under rung
      (a), or rods are drawn but no spacing dimension and no typical-spacing note appears anywhere in
      these images so spacing cannot be verified; say so rather than assuming compliance. DEFERRED = rung
      (b): another qualifying electrode is shown and no rods are used.

      ABSENCE RULE (absence_is = defect): where these images DO carry electrode content, a missing grounding
      electrode SYSTEM is itself the defect - that is rung (a), a Fail, never silence. A missing ROD where
      another electrode is present is rung (b), Deferred. A batch with no electrode plan in it at all
      is Needs Review, not Fail. SCOPE OF ANY GENERIC ''If absent'' LINE RENDERED BELOW THIS INSTRUCTION:
      that line governs an item missing from an electrode plan that IS in this batch - report Fail. The
      rung (a) gate, the rung (b) DEFERRED branch and the Needs Review branch above take precedence over
      the generic line.

      MULTI-INSTANCE: emit one finding per electrode group or pad where the answer differs, with "instance"
      set to the pad or area tag as printed.

      Severity: high for (a) and (e), medium for a missing rod spec, medium for spacing under 6 ft, low
      for the 2x best-practice note.'
    absence_is: defect
    nec_ref: NEC 250.50, 250.52(A)(5), 250.53(A)(2), 250.53(A)(3), 250.53(B), 250.53(G). The 'twice the
      rod length' spacing figure is an Informational Note to 250.53(A)(3), not a requirement.
    aliases:
    - Ground rods shown and spacing
    - Ground rods presence and spacing
