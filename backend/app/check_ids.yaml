  - id: gec_sizing
    title: Grounding electrode conductor sizing (Table 250.66 and its limiters)
    instruction: "For the service and for EACH separately derived system (each transformer secondary carrying\
      \ a system bonding jumper), read the largest ungrounded supply or derived conductor, read the GEC\
      \ size and material, and NAME WHICH ELECTRODE THE GEC RUNS TO before you size anything. The electrode\
      \ decides whether the table applies at all.\nSTEP 1 - THE LIMITERS. Apply these FIRST; each caps\
      \ the required size:\n  250.66(A): where the GEC, or the portion of it that is the SOLE connection\
      \ to a made rod, pipe or plate electrode, it need not be larger than 6 AWG copper (4 AWG aluminium).\n\
      \  250.66(B): where it is the sole connection to a concrete-encased (Ufer) electrode, it need not\
      \ be larger than 4 AWG copper.\n  250.66(C): where it is the sole connection to a ground ring, it\
      \ need not be larger than the ring conductor itself.\n  So a #6 Cu tap to a ground rod on a service\
      \ with 750 kcmil supply conductors is CORRECT, not undersized. Applying the table over a limiter\
      \ is the main way this check false-Fails a compliant design; do not do it. A limiter only ever CAPS\
      \ the requirement - it never raises it. If you cannot tell which electrode the GEC serves, that\
      \ is Needs Review, not Fail.\nSTEP 2 - where no limiter applies (the conductor serves the whole\
      \ electrode system, a metal water pipe electrode, or a building steel electrode), size from TABLE\
      \ 250.66 on the largest ungrounded conductor:\n  supply 2 AWG Cu or smaller, or 1/0 Al or smaller\
      \ -> GEC 8 AWG Cu / 6 AWG Al\n  1 or 1/0 Cu, or 2/0 or 3/0 Al -> 6 Cu / 4 Al\n  2/0 or 3/0 Cu, or\
      \ 4/0 or 250 kcmil Al -> 4 Cu / 2 Al\n  over 3/0 through 350 kcmil Cu, or over 250 through 500 kcmil\
      \ Al -> 2 Cu / 1/0 Al\n  over 350 through 600 kcmil Cu, or over 500 through 900 kcmil Al -> 1/0\
      \ Cu / 3/0 Al\n  over 600 through 1100 kcmil Cu, or over 900 through 1750 kcmil Al -> 2/0 Cu / 4/0\
      \ Al\n  over 1100 kcmil Cu, or over 1750 kcmil Al -> 3/0 Cu / 250 kcmil Al\n  Where the supply conductors\
      \ are PARALLELED, the equivalent size is the SUM of the cross-sectional areas of the parallel conductors\
      \ of one phase.\n  At a separately derived system the GEC is required by NEC 250.30(A)(4) (which\
      \ electrode it must connect to) and sized by 250.30(A)(5) from Table 250.66 on the largest ungrounded\
      \ DERIVED conductor. Cite those at a transformer, not 250.24.\n  MULTIPLE SEPARATELY DERIVED SYSTEMS\
      \ - NEC 250.30(A)(6): several separately derived systems are PERMITTED to share a COMMON grounding\
      \ electrode conductor with a tap from each system to it. A transformer connected by a tap to a common\
      \ GEC HAS a GEC - do not Fail it as missing, and do not Fail it once per transformer. Sizing: the\
      \ common GEC shall not be smaller than 3/0 AWG copper or 250 kcmil aluminium (250.30(A)(6)(a)) -\
      \ note this is exactly the top row of Table 250.66, so it is never smaller than what the table would\
      \ demand for the largest derived system served; each TAP is sized from Table 250.66 on the derived\
      \ conductors of the system it serves (250.30(A)(6)(b)). Taps must be connected to the common GEC\
      \ without splicing it, by an irreversible means or a listed connector.\nPut the whole chain in the\
      \ evidence. WORKED EXAMPLE where a limiter BINDS and produces the counterintuitive Pass: \"Service\
      \ supply 2 x 750 kcmil Cu per phase -> equivalent 1500 kcmil -> Table 250.66 would give 3/0 Cu;\
      \ but this conductor is the SOLE connection to a driven ground rod, so 250.66(A) caps the requirement\
      \ at 6 AWG Cu -> drawing shows #6 Cu -> PASS (not undersized)\". Second example, where the cap does\
      \ not bind: \"XFMR-1 secondary 2 x 600 kcmil Cu per phase -> equivalent 1200 kcmil -> Table 250.66\
      \ gives 3/0 Cu; the GEC runs to the ground ring, so 250.66(C) caps it at the 4/0 ring conductor,\
      \ a cap above the table requirement and therefore inert here -> the governing size stays 3/0 Cu\
      \ -> drawing shows 4/0 bare Cu -> PASS\".\nFAIL = a GEC smaller than the governing requirement AFTER\
      \ the limiters are applied, or a depicted service or separately derived system with no GEC and no\
      \ tap to a common GEC shown at all. PASS = electrode named, lookup shown, size meets the governing\
      \ requirement. NEEDS REVIEW = the supply/derived conductor size, or which electrode the GEC serves,\
      \ cannot be read from these sheets. DEFERRED = no service and no separately derived system is depicted\
      \ in this batch; give the one-line reason.\nABSENCE RULE (absence_is = defect): a GEC is required\
      \ at every service (250.24(D)) and at every separately derived system (250.30(A)(5)), so a missing\
      \ GEC callout on a depicted service or transformer IS the defect - Fail it, do not go quiet. SCOPE\
      \ OF ANY GENERIC 'If absent' LINE RENDERED BELOW THIS INSTRUCTION: that line governs an item missing\
      \ from a system that IS depicted here (a transformer on the sheet with no GEC and no common-GEC\
      \ tap) - report Fail. Where no service and no separately derived system appears in this image batch\
      \ at all, the DEFERRED branch above governs and takes precedence over the generic line.\nMULTI-INSTANCE:\
      \ emit ONE FINDING PER SYSTEM, with \"instance\" set to the transformer or service tag as printed\
      \ (\"XFMR-1\", \"XFMR-2\", \"Service 1\"). Never report two transformers in one merged row.\nSeverity:\
      \ high if undersized or missing, medium if the electrode served is unstated."
    absence_is: defect
    nec_ref: NEC Table 250.66; 250.66(A), 250.66(B), 250.66(C); 250.24(D) (service); 250.30(A)(4) and
      250.30(A)(5) (separately derived system); 250.30(A)(6) and (A)(6)(a),(b) (common GEC and taps for
      multiple separately derived systems)
    aliases:
    - GEC per NEC 250.66
    - GEC size per NEC 250.66
    - GEC sizing per NEC 250.66
    - Grounding electrode conductor size per NEC 250.66
    - Grounding electrode conductor sizing
    - Grounding electrode conductor size validation
    - Grounding electrode conductor sizing per NEC 250.66
